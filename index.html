<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My GTA Game</title>
  <style>
    body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    canvas { background: #3b7a3b; border: 3px solid #555; margin-top: 10px; }
    p { margin: 8px 0; font-size: 14px; }
  </style>
</head>
<body>
  <p><b>Controls:</b> WASD / Arrows to Move & Drive | <b>E</b> to Enter/Exit Car | <b>Space</b> to Brake/Drift</p>
  <canvas id="game" width="800" height="550"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const player = { x: 200, y: 275, size: 16, speed: 3, inCar: false };
    const car = { x: 260, y: 275, w: 44, h: 24, angle: 0, speed: 0, maxSpeed: 7 };
    const keys = {};

    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === "e") {
        if (player.inCar) {
          player.inCar = false;
          player.x = car.x - Math.sin(car.angle) * 32;
          player.y = car.y + Math.cos(car.angle) * 32;
        } else if (Math.hypot(player.x - car.x, player.y - car.y) < 45) {
          player.inCar = true;
        }
      }
    });
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    function update() {
      if (!player.inCar) {
        if (keys["w"] || keys["arrowup"]) player.y -= player.speed;
        if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
        if (keys["a"] || keys["arrowleft"]) player.x -= player.speed;
        if (keys["d"] || keys["arrowright"]) player.x += player.speed;
      } else {
        if (keys["w"] || keys["arrowup"]) car.speed = Math.min(car.speed + 0.25, car.maxSpeed);
        if (keys["s"] || keys["arrowdown"]) car.speed = Math.max(car.speed - 0.25, -car.maxSpeed / 2);
        if (keys[" "]) car.speed *= 0.85;

        if (Math.abs(car.speed) > 0.2) {
          const dir = car.speed > 0 ? 1 : -1;
          if (keys["a"] || keys["arrowleft"]) car.angle -= 0.05 * dir;
          if (keys["d"] || keys["arrowright"]) car.angle += 0.05 * dir;
        }
        car.speed *= 0.96;
        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;
        player.x = car.x;
        player.y = car.y;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Roads
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 225, 800, 100);
      ctx.fillRect(350, 0, 100, 550);

      // Road markings
      ctx.strokeStyle = "#f1c40f";
      ctx.setLineDash([20, 15]);
      ctx.beginPath();
      ctx.moveTo(0, 275); ctx.lineTo(800, 275);
      ctx.moveTo(400, 0); ctx.lineTo(400, 550);
      ctx.stroke();
      ctx.setLineDash([]);

      // Car
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(-car.w / 2, -car.h / 2, car.w, car.h);
      ctx.fillStyle = "#222";
      ctx.fillRect(4, -car.h / 2 + 3, 10, car.h - 6); // windshield
      ctx.restore();

      // Player
      if (!player.inCar) {
        ctx.fillStyle = "#3498db";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
